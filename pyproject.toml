[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zimt"
version = "0.1.0"
description = "Multi-model image-generation REPL + web UI for Intel Arc / NVIDIA / AMD GPUs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # torch, torchvision are backend-specific (xpu / cuda / rocm / cpu) and
  # pinned at the deployment layer (the Nix flake, or your venv).
  # Qwen-Image 2.1 is not in the 0.40 stable release. Keep the Nix pin in sync.
  "diffusers @ git+https://github.com/huggingface/diffusers.git@cc8644b447d8f11074d3df06d0ee0e3e7c91bf75",
  "transformers>=5.17,<6",
  "accelerate>=1.15",
  "huggingface_hub>=1.32,<2",
  "Pillow",
  "safetensors>=0.8",
  "fastapi",
  "uvicorn",
  # Required backend for the LoRA stacking API in modern diffusers
  # (load_lora_weights + set_adapters with multi-adapter weights).
  "peft>=0.21",
  # Prompt weighting for SDXL — optional at runtime; the import is wrapped.
  "compel",
  # fp8 quantization for the FLUX.1 + FLUX.2-klein transformers (chosen over
  # torchao after benchmarking on XPU — see src/zimt/models/flux.py).
  "optimum-quanto",
]

[project.optional-dependencies]
ideogram = ["bitsandbytes>=0.43.3"]

[project.scripts]
zimt = "zimt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["zimt*"]

[tool.setuptools.package-data]
zimt = []

[tool.pyright]
include = ["src"]
exclude = [".venv", "**/__pycache__"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingImports = "warning"      # diffusers/transformers types are loose
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownLambdaType = "none"
reportUnknownParameterType = "none"
# diffusers/torch have many public symbols missing from their __init__.py
# `__all__` lists — pyright flags every import. These aren't bugs in our
# code, so the diagnostic is off-noise here.
reportPrivateImportUsage = "none"
